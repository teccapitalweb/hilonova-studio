packages:
  - "apps/*"
  - "packages/*"
# sharp es opcional (optimización de imágenes de Next en prod). Su build nativo
# no es necesario en dev; se habilitará si hace falta.
allowBuilds:
  # ambos tienen postinstall scripts opcionales (polyfills de core-js, binario
  # nativo de sharp). No los necesitamos en dev — se habilitan si hacen falta.
  '@firebase/util': false
  core-js: false
  esbuild: false
  protobufjs: false
  sharp: false
